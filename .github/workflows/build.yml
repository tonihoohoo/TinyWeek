name: build

# Every push and pull request builds TinyWeek.exe.
# A push to main whose VERSION file names a version that has no release yet
# also tags that commit as v<VERSION> and publishes the release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        run: |
          ./build.sh
          cd build && sha256sum TinyWeek.exe > TinyWeek.exe.sha256 && cat TinyWeek.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TinyWeek
          path: |
            build/TinyWeek.exe
            build/TinyWeek.exe.sha256

      - name: Publish release for a new VERSION
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released, nothing to publish."
          else
            gh release create "$TAG" build/TinyWeek.exe build/TinyWeek.exe.sha256 \
              --target "$GITHUB_SHA" --title "TinyWeek $TAG" --generate-notes
          fi
