name: build

# Every push and pull request builds TinyWeek.exe.
# A push to main whose VERSION file names a version that has no release yet
# also tags that commit as v<VERSION> and publishes the release, with the
# matching section of CHANGELOG.md as its release notes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        run: |
          ./build.sh
          cd build && sha256sum TinyWeek.exe > TinyWeek.exe.sha256 && cat TinyWeek.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TinyWeek
          path: |
            build/TinyWeek.exe
            build/TinyWeek.exe.sha256

      - name: Publish release for a new VERSION
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released, nothing to publish."
            exit 0
          fi
          # Release notes = the "## <version>" section of CHANGELOG.md (required).
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($2 == v || $2 == "[" v "]"); next }
            found' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section. Add release notes before releasing."
            exit 1
          fi
          cat notes.md
          gh release create "$TAG" build/TinyWeek.exe build/TinyWeek.exe.sha256 \
            --target "$GITHUB_SHA" --title "TinyWeek $TAG" --notes-file notes.md
